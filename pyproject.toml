[project]
name = "ori"
version = "3.0.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "google-adk[a2a]>=2.0.0b1,<3.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "apscheduler>=3.11.2",
    "aiosqlite>=0.22.1",
    "rich>=14.3.3",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.0.0,<6.0.0",
    "lancedb>=0.11.0",
    "fastembed>=0.3.4",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "anthropic>=0.52.0",
    "litellm>=1.83.1,!=1.82.7,!=1.82.8",
    # amazon_manager domain extras
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "striprtf>=0.0.28",
    "python-amazon-sp-api>=0.26.0",
    "neo4j>=5.0.0",
    "slack-bolt>=1.18.0",
    "google-cloud-bigquery>=3.20.0",
    "db-dtypes>=1.2.0",
    "pyarrow>=15.0.0",
]
requires-python = ">=3.10,<3.14"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pip-audit>=2.7.0",
    "ipython>=8.39.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.0.0,<2.0.0",
    "jupyter-client>=8.0.0,<9.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",   # line too long — formatter handles this
    "C901",   # too complex
    "B006",   # mutable default arg — accepted pattern in agent tools
    "RUF006", # asyncio.create_task without storing the return value — our
              # fire-and-forget pattern (background dispatch, polling tasks)
              # is intentional in transports and scheduling. Storing a ref
              # just to satisfy the lint adds noise without benefit.
    "RUF002", # ambiguous unicode in docstrings (×, —, etc.) — these
              # improve readability in math/units; not a real bug.
    "RUF003", # same for comments.
]

[tool.ruff.lint.per-file-ignores]
# Legacy evolution catalog — not actively maintained; lint-clean isn't worth it.
"evolutions/**/*.py" = ["ALL"]
# Module-level import-after-env-setup pattern is intentional in these entry
# points (vault load, sys.path injection, etc. happen before adk imports).
"run_bot.py" = ["E402"]
"deploy/ori-supervisor.py" = ["E402"]
# OAuth callback imports below the route handlers — deliberate placement
# noted in inline comments. F401 is intentional re-export (test imports).
"app/a2a_server.py" = ["E402"]
# Test files commonly need imports placed near setup/teardown blocks; tests
# also probe optional-imports availability, which trips F401.
"tests/test_executor_and_a2a.py" = ["E402"]
"tests/test_mcp_import.py" = ["F401"]
"tests/conftest.py" = ["E402", "F401"]  # F401 covers optional-import probes in try/except
# matplotlib.use("Agg") must run BEFORE pyplot is imported, so the
# import order is load-bearing (cannot all live at top of file).
"app/tools/visualize.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb,**/package-lock.json"


[tool.uv]
prerelease = "allow"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"




[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]

[tool.agent-starter-pack]
# Generation metadata - enables CLI commands to understand project context
# These fields allow any generated project to work as a remote template
name = "ori"
version = "3.0.0"
description = ""
base_template = "local_ori"
agent_directory = "app"

# Generation context
generated_at = "2024-03-29T13:46:28.241758+00:00"
asp_version = "0.39.6"

[tool.agent-starter-pack.create_params]
# Parameters used during project creation
deployment_target = "cloud_run"
session_type = "in_memory"
cicd_runner = "skip"
include_data_ingestion = false
datastore = "none"
