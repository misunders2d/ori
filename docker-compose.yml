services:
  ori-agent:
    image: ori-agent-image
    build: .
    init: true
    stdin_open: true
    tty: true
    environment:
      - DOTENV_PATH=/code/data/.env
      - AGENT_UID=${AGENT_UID:-1000}
      - AGENT_GID=${AGENT_GID:-1000}
    ports:
      - "${AGENT_PORT:-0}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/.well-known/agent.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # --- Docker socket (required for health stats, agent spawning) ---
      - /var/run/docker.sock:/var/run/docker.sock
      # --- Mutable state (persisted across rebuilds) ---
      - ./data:/code/data:z
      - ./.git:/code/.git:z
      # --- Self-evolvable code (bot logic, not infra) ---
      - ./app:/code/app:z
      - ./skills:/code/skills:z
      - ./interfaces:/code/interfaces:z
      - ./tests:/code/tests:z
      - ./run_bot.py:/code/run_bot.py:z
      # NOTE: Dockerfile, docker-compose.yml, entrypoint.sh, launcher.sh
      # are NOT mounted. They are baked into the image and outside the
      # self-evolution scope. Only launcher.sh (host-side) can rebuild.

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://ori-agent:8000 --metrics 0.0.0.0:2000
    restart: unless-stopped
    depends_on:
      - ori-agent
