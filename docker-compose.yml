services:
  ori-agent:
    image: ori-agent-image
    build: .
    init: true
    stdin_open: true
    tty: true
    environment:
      - DOTENV_PATH=/code/data/.env
      - AGENT_UID=${AGENT_UID:-1000}
      - AGENT_GID=${AGENT_GID:-1000}
    ports:
      - "${AGENT_PORT:-0}:8000"
    restart: unless-stopped
    volumes:
      # Use :z to ensure SELinux relabeling (cross-distribution compatibility)
      - ./data:/code/data:z
      - ./.git:/code/.git:z
      - ./app:/code/app:z
      - ./skills:/code/skills:z
      - ./interfaces:/code/interfaces:z
      - ./tests:/code/tests:z
      - ./run_bot.py:/code/run_bot.py:z
      # Mounting system files as well so the agent can self-evolve them
      - ./Dockerfile:/code/Dockerfile:z
      - ./docker-compose.yml:/code/docker-compose.yml:z
      - ./entrypoint.sh:/code/entrypoint.sh:z
      - ./start.sh:/code/start.sh:z

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://ori-agent:8000
    restart: unless-stopped
    depends_on:
      - ori-agent
