services:
  ori-agent:
    image: ori-agent-image
    build: .
    init: true
    stdin_open: true
    tty: true
    environment:
      - DOTENV_PATH=/code/data/.env
    ports:
      - "${AGENT_PORT:-0}:8000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./data
        target: /code/data
      - type: bind
        source: ./.git
        target: /code/.git
      - type: bind
        source: ./app
        target: /code/app
      - type: bind
        source: ./skills
        target: /code/skills
      - type: bind
        source: ./interfaces
        target: /code/interfaces

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://ori-agent:8000
    restart: unless-stopped
    depends_on:
      - ori-agent
