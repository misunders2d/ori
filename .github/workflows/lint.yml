name: lint

on:
  push:
    branches: [master, "evo/**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Run ruff
        run: uv run --with "ruff>=0.4.6" ruff check .
